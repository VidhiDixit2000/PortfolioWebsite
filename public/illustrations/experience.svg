<svg width="580" height="360" viewBox="0 0 580 360" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
  /* Palette: blue #A9D4E4 · pink #F6B0DF · orange #F2A661
     cream #FBF3E7 · coral #E4574C · outline #2A2440          */

  #face {
    transform-box: view-box;
    transform-origin: 290px 190px;
    animation: nod 4.6s ease-in-out infinite;
  }
  @keyframes nod {
    0%, 100% { transform: rotate(-1.5deg); }
    50%      { transform: rotate(1.5deg); }
  }

  #eyes {
    animation: glance 4.6s ease-in-out infinite;
  }
  @keyframes glance {
    0%, 22%   { transform: translateX(0); }
    34%, 48%  { transform: translateX(14px); }
    60%, 74%  { transform: translateX(-14px); }
    86%, 100% { transform: translateX(0); }
  }

  #eyeset {
    transform-box: view-box;
    transform-origin: 290px 176px;
    animation: blink 4.6s ease-in-out infinite;
  }
  @keyframes blink {
    0%, 49%, 55%, 100% { transform: scaleY(1); }
    51%, 53%           { transform: scaleY(0.06); }
  }

  #glints path { animation: shine 4.6s ease-in-out infinite; }
  #glints path:nth-child(2) { animation-delay: 0.12s; }
  @keyframes shine {
    0%, 70%   { opacity: 0.35; }
    80%       { opacity: 1; }
    92%, 100% { opacity: 0.35; }
  }

  @media (prefers-reduced-motion: reduce) {
    #face, #eyes, #eyeset, #glints path { animation: none; }
  }
</style>

<g id="face" fill="none" stroke="#2A2440" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">

  <g id="brows" stroke-width="9">
    <path id="brow-left"  d="M140 68 Q 190 44 244 66"/>
    <path id="brow-right" d="M336 66 Q 390 44 440 68"/>
  </g>

  <g id="eyeset">
    <circle id="eye-left-white"  cx="190" cy="176" r="34" fill="#FBF3E7"/>
    <circle id="eye-right-white" cx="390" cy="176" r="34" fill="#FBF3E7"/>
    <g id="eyes" fill="#2A2440" stroke="none">
      <circle cx="190" cy="176" r="16"/>
      <circle cx="390" cy="176" r="16"/>
    </g>
  </g>

  <path id="nose" d="M290 152 C 286 202 272 240 256 262 C 272 282 306 278 316 262" stroke-width="8"/>

  <g id="specs">
    <circle id="lens-left"  cx="190" cy="176" r="82" fill="#A9D4E4" fill-opacity="0.34"/>
    <circle id="lens-right" cx="390" cy="176" r="82" fill="#A9D4E4" fill-opacity="0.34"/>
    <path id="bridge" d="M270 156 Q 290 128 310 156" stroke-width="8"/>
    <path id="temple-left"  d="M110 152 L 40 120"/>
    <path id="temple-right" d="M470 152 L 540 120"/>
    <g id="glints" stroke="#FBF3E7" stroke-width="9" stroke-linecap="round">
      <path d="M150 132 L 176 116"/>
      <path d="M350 132 L 376 116"/>
    </g>
  </g>

</g>
</svg>