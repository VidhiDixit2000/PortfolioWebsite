<svg width="520" height="420" viewBox="0 0 520 420" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
  /* Palette: blue #A9D4E4 · pink #F6B0DF · orange #F2A661
     cream #FBF3E7 · coral #E4574C · outline #2A2440          */

  #cap {
    transform-box: view-box;
    transform-origin: 260px 220px;
    animation: lift 3.4s ease-in-out infinite;
  }
  @keyframes lift {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50%      { transform: translateY(-12px) rotate(-2deg); }
  }

  #tassel {
    transform-box: view-box;
    transform-origin: 424px 176px;
    animation: swing 3.4s ease-in-out infinite;
  }
  @keyframes swing {
    0%, 100% { transform: rotate(9deg); }
    50%      { transform: rotate(-9deg); }
  }

  #stars path {
    transform-box: fill-box;
    transform-origin: center;
    animation: twinkle 2.6s ease-in-out infinite;
  }
  #stars path:nth-child(2) { animation-delay: 0.5s; }
  #stars path:nth-child(3) { animation-delay: 1.0s; }
  #stars path:nth-child(4) { animation-delay: 1.5s; }
  #stars path:nth-child(5) { animation-delay: 2.0s; }
  @keyframes twinkle {
    0%, 100% { transform: scale(0.72) rotate(0deg);   opacity: 0.45; }
    50%      { transform: scale(1.15) rotate(22deg);  opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    #cap, #tassel, #stars path { animation: none; }
  }
</style>

  <g id="stars" stroke="#2A2440" stroke-width="6" stroke-linejoin="round" fill="none">
      <path d="M95.1 64.2 L98.9 78.9 L113.7 82.2 L100.9 90.3 L102.3 105.4 L90.6 95.8 L76.7 101.8 L82.3 87.7 L72.2 76.4 L87.4 77.3 Z" fill="#F2A661"/>
      <path d="M434.5 79.4 L441.1 89.0 L452.7 87.5 L445.6 96.8 L450.6 107.4 L439.6 103.5 L431.1 111.5 L431.4 99.8 L421.1 94.2 L432.3 90.9 Z" fill="#E4574C"/>
      <path d="M155.1 277.9 L155.6 288.2 L165.0 292.5 L155.3 296.2 L154.1 306.4 L147.7 298.3 L137.6 300.4 L143.3 291.8 L138.2 282.8 L148.1 285.5 Z" fill="#A9D4E4"/>
      <path d="M110.0 325.1 L116.3 336.6 L129.4 336.3 L120.4 345.8 L124.7 358.1 L112.9 352.5 L102.5 360.5 L104.2 347.5 L93.4 340.0 L106.3 337.6 Z" fill="#F2A661"/>
      <path d="M272.0 32.0 L275.7 40.9 L285.3 41.7 L278.0 47.9 L280.2 57.3 L272.0 52.3 L263.8 57.3 L266.0 47.9 L258.7 41.7 L268.3 40.9 Z" fill="#E4574C"/>
  </g>

<g id="cap" fill="none" stroke="#2A2440" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">

  <g id="cap-head">
    <path id="cap-crown" d="M182 194 V 236 Q 260 284 338 236 V 194 Z" fill="#E3E48A"/>
  </g>

  <g id="mortarboard">
    <path id="board" d="M260 96 L 460 170 L 260 244 L 60 170 Z" fill="#A9D4E4"/>
    <circle id="board-button" cx="260" cy="170" r="15" fill="#E4574C"/>
  </g>

  <g id="tassel">
    <path id="tassel-cord" d="M260 170 Q 360 150 424 176" stroke="#2A2440" stroke-width="6"/>
    <path id="tassel-body" d="M424 176 V 244" stroke="#2A2440" stroke-width="6"/>
    <path id="tassel-bunch" d="M400 244 H 448 L 440 306 Q 424 318 408 306 Z" fill="#A9D4E4"/>
  </g>

</g>
</svg>