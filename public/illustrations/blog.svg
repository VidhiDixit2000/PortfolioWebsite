<svg width="580" height="360" viewBox="0 0 580 360" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
  /* Palette: blue #A9D4E4 · pink #F6B0DF · orange #F2A661
     cream #FBF3E7 · coral #E4574C · outline #2A2440          */

  #ink {
    stroke-dasharray: 1;
    stroke-dashoffset: 1;
    animation: write 5s ease-in-out infinite;
  }
  @keyframes write {
    0%        { stroke-dashoffset: 1; }
    64%, 86%  { stroke-dashoffset: 0; }
    100%      { stroke-dashoffset: 1; }
  }

  #pen {
    transform-box: view-box;
    transform: translate(92.0px, 236.0px) rotate(-22deg);
    animation: travel 5s ease-in-out infinite;
  }
  @keyframes travel {
    0.0%  { transform: translate(92.0px, 236.0px) rotate(-22deg); }
    5.8%  { transform: translate(128.0px, 194.8px) rotate(-22deg); }
    11.6%  { transform: translate(164.0px, 180.3px) rotate(-22deg); }
    17.5%  { transform: translate(200.0px, 200.0px) rotate(-22deg); }
    23.3%  { transform: translate(236.0px, 236.8px) rotate(-22deg); }
    29.1%  { transform: translate(272.0px, 262.1px) rotate(-22deg); }
    34.9%  { transform: translate(308.0px, 256.9px) rotate(-22deg); }
    40.7%  { transform: translate(344.0px, 225.4px) rotate(-22deg); }
    46.5%  { transform: translate(380.0px, 192.4px) rotate(-22deg); }
    52.4%  { transform: translate(416.0px, 184.7px) rotate(-22deg); }
    58.2%  { transform: translate(452.0px, 211.1px) rotate(-22deg); }
    64.0%  { transform: translate(488.0px, 255.8px) rotate(-22deg); }
    78%   { transform: translate(488.0px, 215.8px) rotate(-14deg); }
    92%   { transform: translate(92.0px, 196.0px) rotate(-14deg); }
    100%  { transform: translate(92.0px, 236.0px) rotate(-22deg); }
  }

  #rules path {
    stroke-dasharray: 1;
    stroke-dashoffset: 1;
    animation: rule 5s ease-in-out infinite;
  }
  #rules path:nth-child(2) { animation-delay: 0.14s; }
  @keyframes rule {
    0%, 62%  { stroke-dashoffset: 1; }
    72%, 86% { stroke-dashoffset: 0; }
    100%     { stroke-dashoffset: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    #ink, #pen, #rules path { animation: none; }
    #ink, #rules path { stroke-dashoffset: 0; }
    #pen { transform: translate(488.0px, 255.8px) rotate(-22deg); }
  }
</style>

<g fill="none" stroke="#2A2440" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">

  <path id="ink" pathLength="1" stroke="#E4574C" stroke-width="11"
        d="M92 236 C 158 158, 224 300, 290 214 C 356 132, 422 268, 488 200"/>

  <g id="rules" stroke="#A9D4E4" stroke-width="10" stroke-linecap="round">
    <path pathLength="1" d="M108 296 H 396"/>
    <path pathLength="1" d="M108 332 H 306"/>
  </g>

  <g id="pen">
    <path id="nib" d="M0 0 L -13 -30 L 13 -30 Z" fill="#FBF3E7"/>
    <path id="nib-slit" d="M0 -6 V -22" stroke-width="5"/>
    <rect id="ferrule" x="-16" y="-48" width="32" height="20" rx="5" fill="#F2A661"/>
    <path id="barrel" d="M-16 -48 L 16 -48 L 11 -156 Q 0 -168 -11 -156 Z" fill="#A9D4E4"/>
    <path id="cap-band" d="M-14 -108 L 14 -108" stroke-width="8"/>
  </g>

</g>
</svg>