<svg width="440" height="580" viewBox="0 0 440 580" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
  /* Palette: blue #A9D4E4 · pink #F6B0DF · orange #F2A661
     cream #FBF3E7 · coral #E4574C · outline #2A2440          */

  #sheet {
    transform-box: view-box;
    transform-origin: 220px 290px;
    animation: hover 3.6s ease-in-out infinite;
  }
  @keyframes hover {
    0%, 100% { transform: translateY(0) rotate(-1deg); }
    50%      { transform: translateY(-11px) rotate(1deg); }
  }

  #lines rect {
    transform-box: view-box;
    transform-origin: left center;
    animation: type 4.8s ease-in-out infinite;
  }
  #lines rect:nth-child(1) { animation-delay: 0.00s; }
  #lines rect:nth-child(2) { animation-delay: 0.13s; }
  #lines rect:nth-child(3) { animation-delay: 0.26s; }
  #lines rect:nth-child(4) { animation-delay: 0.39s; }
  #lines rect:nth-child(5) { animation-delay: 0.52s; }
  #lines rect:nth-child(6) { animation-delay: 0.65s; }
  @keyframes type {
    0%        { transform: scaleX(0); opacity: 0; }
    14%       { transform: scaleX(1); opacity: 1; }
    82%       { transform: scaleX(1); opacity: 1; }
    92%, 100% { transform: scaleX(0); opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    #sheet, #lines rect { animation: none; }
    #lines rect { transform: scaleX(1); opacity: 1; }
  }
</style>

<g id="sheet" fill="none" stroke="#2A2440" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">

  <rect id="paper" x="56" y="48" width="328" height="480" rx="16" fill="#FBF3E7"/>

  <g id="masthead">
    <rect id="photo" x="96" y="92" width="86" height="102" rx="10" fill="#F2A661"/>
    <circle id="photo-head" cx="139" cy="130" r="18" fill="#FBF3E7" stroke-width="6"/>
    <path id="photo-body" d="M112 176 Q 139 146 166 176" fill="#FBF3E7" stroke-width="6"/>
    <rect id="name-bar" x="200" y="104" width="144" height="22" rx="11" fill="#E4574C"/>
    <rect id="role-bar" x="200" y="144" width="104" height="16" rx="8" fill="#A9D4E4"/>
  </g>

  <path id="rule" d="M96 222 H 344" stroke-width="6"/>

  <g id="lines" stroke="none">
      <rect x="108" y="252" width="190" height="17" rx="8" fill="#A9D4E4"/>
      <rect x="108" y="288" width="236" height="17" rx="8" fill="#F6B0DF"/>
      <rect x="108" y="324" width="206" height="17" rx="8" fill="#A9D4E4"/>
      <rect x="108" y="378" width="150" height="17" rx="8" fill="#F6B0DF"/>
      <rect x="108" y="414" width="236" height="17" rx="8" fill="#A9D4E4"/>
      <rect x="108" y="450" width="178" height="17" rx="8" fill="#F6B0DF"/>
  </g>

</g>
</svg>