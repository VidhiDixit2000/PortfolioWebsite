<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 480" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="hc">
      <rect x="70" y="-800" width="360" height="1055"/>
    </clipPath>
    <clipPath id="env">
      <rect x="62" y="255" width="376" height="200" rx="20"/>
    </clipPath>
  </defs>

  <style>
    @keyframes sealedFlap {
      0%,8%     { transform:scaleY(1);  animation-timing-function:ease-in }
      20%       { transform:scaleY(0) }
      20.1%,65% { transform:scaleY(0) }
      75%       { transform:scaleY(0);  animation-timing-function:ease-out }
      85%       { transform:scaleY(1) }
      100%      { transform:scaleY(1) }
    }
    @keyframes openFlap {
      0%,20%  { transform:scaleY(0) }
      28%     { transform:scaleY(1); animation-timing-function:linear }
      65%     { transform:scaleY(1); animation-timing-function:ease-in }
      75%     { transform:scaleY(0) }
      100%    { transform:scaleY(0) }
    }
    @keyframes handAnim {
      0%,28%   { transform:translateY(158px) }
      42%      { transform:translateY(0px);   animation-timing-function:ease-in-out }
      49%      { transform:translateY(-12px); animation-timing-function:ease-in-out }
      54%      { transform:translateY(-2px);  animation-timing-function:ease-in-out }
      59%      { transform:translateY(-9px);  animation-timing-function:ease-in-out }
      65%      { transform:translateY(0px);   animation-timing-function:ease-in }
      76%,100% { transform:translateY(158px) }
    }
    .flap-sealed { transform-origin:250px 255px; animation:sealedFlap 5s linear infinite }
    .flap-open   { transform-origin:250px 255px; animation:openFlap 5s cubic-bezier(.34,1.55,.64,1) infinite }
    .hand        { animation:handAnim 5s cubic-bezier(.34,1.55,.64,1) infinite }
  </style>

  <!-- ENVELOPE BACK -->
  <rect x="62" y="255" width="376" height="200" rx="20" fill="#D4D58C"/>

  <!-- OPEN FLAP -->
  <g class="flap-open">
    <polygon points="64,255 436,255 250,170"
             fill="#C2C478" stroke="#5A5A2A" stroke-width="4"
             stroke-linejoin="round" stroke-linecap="round"/>
  </g>

  <!-- HAND -->
  <g class="hand" clip-path="url(#hc)">
    <rect x="180" y="185" width="140" height="93" rx="18"
          fill="#FBB99A" stroke="#5A5A2A" stroke-width="4"/>
    <text x="204" y="245" font-family="Georgia,'Times New Roman',serif"
          font-size="36" font-style="italic" fill="#3A3A18">hi</text>
    <rect x="184" y="118" width="28" height="79" rx="14"
          fill="#FBB99A" stroke="#5A5A2A" stroke-width="4"/>
    <rect x="216" y="105" width="28" height="92" rx="14"
          fill="#FBB99A" stroke="#5A5A2A" stroke-width="4"/>
    <rect x="248" y="100" width="28" height="97" rx="14"
          fill="#FBB99A" stroke="#5A5A2A" stroke-width="4"/>
    <rect x="280" y="105" width="28" height="92" rx="14"
          fill="#FBB99A" stroke="#5A5A2A" stroke-width="4"/>
    <rect x="299" y="163" width="25" height="64" rx="12"
          fill="#FBB99A" stroke="#5A5A2A" stroke-width="4"
          transform="rotate(22,311,197)"/>
  </g>

  <!-- INTERIOR PANEL -->
  <rect x="62" y="255" width="376" height="200" rx="20" fill="#D4D58C"/>

  <!-- V-FOLD LINES clipped to rounded corners -->
  <g clip-path="url(#env)">
    <line x1="62"  y1="455" x2="250" y2="363"
          stroke="#5A5A2A" stroke-width="4" stroke-linecap="round"/>
    <line x1="438" y1="455" x2="250" y2="363"
          stroke="#5A5A2A" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- ENVELOPE OUTLINE (inset) -->
  <rect x="64" y="257" width="372" height="196" rx="18"
        fill="none" stroke="#5A5A2A" stroke-width="4"
        stroke-linejoin="round" stroke-linecap="round"/>

  <!-- SEALED FLAP + CLASP on outside surface -->
  <g class="flap-sealed">
    <polygon points="64,255 436,255 250,330"
             fill="#D4D58C" stroke="#5A5A2A" stroke-width="4"
             stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="250" cy="326" r="14" fill="#C2C478" stroke="#5A5A2A" stroke-width="4"/>
    <circle cx="250" cy="326" r="7"  fill="#6B6A3A"/>
    <circle cx="246" cy="322" r="2.5" fill="#ffffff" opacity="0.5"/>
  </g>
</svg>