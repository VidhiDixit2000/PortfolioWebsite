<svg width="480" height="600" viewBox="0 0 480 600" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
  /* Palette: blue #A9D4E4 · pink #F6B0DF · olive #E3E48A
     cream #FBF3E7 · coral #E4574C · outline #2A2440        */

  #robot {
    transform-box: view-box;
    transform-origin: 240px 300px;
    animation: bob 3.2s ease-in-out infinite;
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-10px); }
  }

  #antenna-ball {
    transform-box: view-box;
    transform-origin: 240px 48px;
    animation: blip 1.6s ease-in-out infinite;
  }
  @keyframes blip {
    0%, 100% { transform: scale(1);    opacity: 1; }
    50%      { transform: scale(1.35); opacity: 0.55; }
  }

  #pupils {
    animation: look 4.4s ease-in-out infinite;
  }
  @keyframes look {
    0%, 20%   { transform: translateX(0); }
    32%, 44%  { transform: translateX(9px); }
    56%, 68%  { transform: translateX(-9px); }
    80%, 100% { transform: translateX(0); }
  }

  #arm-right {
    transform-box: view-box;
    transform-origin: 373px 274px;
    animation: wave 3.2s ease-in-out infinite;
  }
  @keyframes wave {
    0%, 44%   { transform: rotate(0deg); }
    56%       { transform: rotate(-26deg); }
    68%       { transform: rotate(-8deg); }
    80%       { transform: rotate(-26deg); }
    92%, 100% { transform: rotate(0deg); }
  }

  @media (prefers-reduced-motion: reduce) {
    #robot, #antenna-ball, #pupils, #arm-right { animation: none; }
  }
</style>

<g id="robot" fill="none" stroke="#2A2440" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">

  <g id="antenna">
    <path id="antenna-stem" d="M240 96 V 62"/>
    <circle id="antenna-ball" cx="240" cy="48" r="15" fill="#E4574C"/>
  </g>

  <g id="arm-left">
    <rect id="arm-left-limb" x="88" y="258" width="38" height="122" rx="19" fill="#A9D4E4"/>
    <circle id="hand-left" cx="107" cy="398" r="27" fill="#A9D4E4"/>
  </g>

  <g id="arm-right">
    <rect id="arm-right-limb" x="354" y="258" width="38" height="122" rx="19" fill="#A9D4E4"/>
    <circle id="hand-right" cx="373" cy="398" r="27" fill="#A9D4E4"/>
  </g>

  <g id="legs">
    <rect id="leg-left"  x="166" y="420" width="46" height="94" fill="#A9D4E4"/>
    <rect id="leg-right" x="268" y="420" width="46" height="94" fill="#A9D4E4"/>
    <rect id="foot-left"  x="150" y="508" width="78" height="34" rx="17" fill="#E4574C"/>
    <rect id="foot-right" x="252" y="508" width="78" height="34" rx="17" fill="#E4574C"/>
  </g>

  <g id="body">
    <rect id="neck" x="216" y="222" width="48" height="26" fill="#2A2440"/>
    <rect id="torso" x="130" y="242" width="220" height="184" rx="14" fill="#F6B0DF"/>
    <rect id="panel" x="174" y="286" width="132" height="78" rx="10" fill="#FBF3E7"/>
    <circle id="panel-light-1" cx="207" cy="325" r="11" fill="#E3E48A"/>
    <circle id="panel-light-2" cx="240" cy="325" r="11" fill="#E4574C"/>
    <circle id="panel-light-3" cx="273" cy="325" r="11" fill="#A9D4E4"/>
  </g>

  <g id="head">
    <rect id="head-shell" x="148" y="94" width="184" height="134" rx="28" fill="#E3E48A"/>
    <circle id="eye-left"  cx="202" cy="160" r="28" fill="#FBF3E7"/>
    <circle id="eye-right" cx="278" cy="160" r="28" fill="#FBF3E7"/>
    <g id="pupils" fill="#2A2440" stroke="none">
      <circle cx="202" cy="160" r="12"/>
      <circle cx="278" cy="160" r="12"/>
    </g>
  </g>

</g>
</svg>